name: Deploy to VM

on:
  push:
    branches: [main]

# Two deploys landing on the VM at once would fight over git and pm2. Queue
# them instead; never cancel one mid-flight, which could leave the bot deleted
# from pm2 but not yet restarted.
concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Repository secrets become the VM's .env. Add or change a value in
          # Settings > Secrets and variables > Actions, then re-run the deploy;
          # nobody needs to SSH in to edit config.
          APP_ID: ${{ secrets.APP_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          SMACK_ROLE_ID: ${{ secrets.SMACK_ROLE_ID }}
          PUTT_CALLOUT_CHANNEL_ID: ${{ secrets.PUTT_CALLOUT_CHANNEL_ID }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Forward the values above into the remote shell.
          envs: APP_ID,DISCORD_TOKEN,PUBLIC_KEY,SMACK_ROLE_ID,PUTT_CALLOUT_CHANNEL_ID
          # Abort on the first failing command. Without this the remote script
          # runs to completion regardless, so a rejected `git pull` still built
          # and restarted the old code and the job reported success.
          script_stop: true
          script: |
            set -euo pipefail

            cd ~/revenge-of-krampus-discord-bot

            # Config files are tracked, so editing one on the VM makes `git pull`
            # refuse to overwrite it. Fail here with the actual file list rather
            # than three steps later with a confusing merge error.
            if ! git diff --quiet HEAD; then
              echo "::error::VM working tree has uncommitted changes, so git pull will be rejected. Server-specific values belong in repository secrets, not in tracked config. Revert these files:"
              git status --short
              exit 1
            fi

            # --ff-only: never invent a merge commit on the server.
            git pull --ff-only

            # npm ci, not npm install: install can rewrite package-lock.json,
            # dirtying the tree and blocking the *next* deploy at the check above.
            npm ci

            # Build before touching .env or pm2. A broken build should fail the
            # deploy with the old bot still running and its config untouched.
            npm run build

            # --- Write .env from repository secrets ---------------------------
            # Secrets are the single source of truth, so this file is rewritten
            # wholesale on every deploy and anything added by hand is replaced.
            # Credentials are required; the feature IDs are optional and written
            # empty when unset, which resolveId() reads as "not configured".
            missing=""
            [ -n "${APP_ID:-}" ]        || missing="$missing APP_ID"
            [ -n "${DISCORD_TOKEN:-}" ] || missing="$missing DISCORD_TOKEN"
            [ -n "${PUBLIC_KEY:-}" ]    || missing="$missing PUBLIC_KEY"

            if [ -n "$missing" ]; then
              echo "::error::Missing required repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions. .env was left untouched and the bot is still running."
              exit 1
            fi

            # Write to a temp file and rename, so a failure part-way through can
            # never leave a half-written .env behind. umask keeps it unreadable
            # to other users from the moment it is created.
            umask 077
            tmp=".env.deploy.$$"
            {
              printf '# Generated by .github/workflows/deploy.yml — edits here are overwritten.\n'
              printf 'APP_ID=%s\n'                  "$APP_ID"
              printf 'DISCORD_TOKEN=%s\n'           "$DISCORD_TOKEN"
              printf 'PUBLIC_KEY=%s\n'              "$PUBLIC_KEY"
              printf 'SMACK_ROLE_ID=%s\n'           "${SMACK_ROLE_ID:-}"
              printf 'PUTT_CALLOUT_CHANNEL_ID=%s\n' "${PUTT_CALLOUT_CHANNEL_ID:-}"
            } > "$tmp"
            chmod 600 "$tmp"
            mv -f "$tmp" .env

            # Key names only — never values. The build log is not a place for secrets.
            echo "Wrote .env: APP_ID DISCORD_TOKEN PUBLIC_KEY SMACK_ROLE_ID PUTT_CALLOUT_CHANNEL_ID"
            [ -n "${SMACK_ROLE_ID:-}" ] || echo "note: SMACK_ROLE_ID is empty — /smack stays disabled."
            [ -n "${PUTT_CALLOUT_CHANNEL_ID:-}" ] || echo "note: PUTT_CALLOUT_CHANNEL_ID is empty — the daily roll call stays disabled."

            pm2 delete krampus-bot || true
            pm2 start npm --name krampus-bot -- start
            pm2 save

            # `pm2 start` returns 0 the moment it forks, so it succeeds even when
            # the bot throws on boot (bad token, config typo). Give it a few
            # seconds, then confirm it is actually alive. A non-zero restart count
            # this soon after a fresh start means it already crashed.
            sleep 8

            health=$(pm2 jlist | node -e 'let r="";process.stdin.on("data",d=>r+=d);process.stdin.on("end",()=>{let l;try{l=JSON.parse(r)}catch(e){console.log("unparseable 0");return}const p=l.find(x=>x.name==="krampus-bot");console.log(p?p.pm2_env.status+" "+(p.pm2_env.restart_time||0):"missing 0")})')
            state=${health%% *}
            restarts=${health##* }

            if [ "$state" != "online" ]; then
              echo "::error::krampus-bot is '$state' after deploy, not online."
              pm2 logs krampus-bot --lines 60 --nostream || true
              exit 1
            fi

            if [ "$restarts" -gt 0 ]; then
              echo "::error::krampus-bot restarted $restarts time(s) within 8s of starting — it is crash-looping."
              pm2 logs krampus-bot --lines 60 --nostream || true
              exit 1
            fi

            echo "krampus-bot is online (restarts: $restarts)."
